<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موقع مدرستنا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap">
<style>
:root{--bg:#f5f1ff;--surface:#fff;--ink:#241a3f;--muted:#6b6288;--p:#6c3fd1;--p2:#ff6fa5;--gold:#ffc94d;--mint:#18b394;--bad:#d4473a;--line:#e5ddf7;--soft:#efe8ff;--sh:0 6px 20px rgba(80,50,150,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#150f27;--surface:#211a3b;--ink:#f1edfc;--muted:#a9a1c8;--p:#a88bff;--p2:#ff8dba;--line:#382e5a;--soft:#2d2350;--mint:#4fd6b6;--bad:#ff8b78;--sh:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Cairo",Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:24px 20px 32px;border-radius:0 0 32px 32px;display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;position:relative}
.logo .ic{width:28px;height:28px}
.hero h1{font:600 28px/1.3 "Reem Kufi","Cairo",sans-serif;margin:0;position:relative}
.hero p{margin:0;opacity:.95;position:relative;font-size:15px}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:fl 9s ease-in-out infinite}
.b1{width:150px;height:150px;top:-50px;left:-30px}.b2{width:90px;height:90px;bottom:-30px;right:35%;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(16px) scale(1.08)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg)}
nav a{flex:none;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;box-shadow:var(--sh)}
nav a .ic{width:18px;height:18px}
nav a.on{background:var(--p);color:var(--surface)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:720px;margin:auto;padding:6px 16px 100px}
h2{font-size:23px;margin:10px 0 0}.sub{color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border-radius:20px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;animation:up .45s both}
.card.col{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(n+5){animation-delay:.2s}
.t{font-weight:800}.m{color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:8px 16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.95)}.btn.alt{background:none;color:var(--p);border:1.5px solid var(--p)}
.cnt{display:inline-block;background:var(--mint);color:#06281f;border-radius:999px;padding:0 12px;font-weight:800;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--sh);border:1px solid var(--line);animation:up .5s both}
.tile .bx{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--p);display:grid;place-items:center;margin-bottom:8px}
.tile b{display:block}.tile span{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.tile.wide{grid-column:1/-1;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
.tile.wide .bx{background:rgba(255,255,255,.22);color:#fff}.tile.wide span{color:#fff;opacity:.92}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
label{font-weight:600;font-size:15px}
.rank{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#2a1f08;display:grid;place-items:center;font-weight:800;flex:none}
.rk{display:flex;gap:12px;align-items:center}
.badge{background:var(--gold);color:#2a1f08;border-radius:999px;font-size:12px;padding:1px 10px;font-weight:800;white-space:nowrap}
.opt{display:block;width:100%;text-align:start;font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 22%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--surface))}
.note{font-size:14px;color:var(--muted);border-inline-start:4px solid var(--gold);padding:2px 12px;margin:12px 0}
.msg{color:var(--mint);font-weight:700;margin:0}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.empty .ic{width:36px;height:36px;color:var(--p);opacity:.7}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{max-width:85%;padding:9px 14px;border-radius:18px;white-space:pre-wrap;animation:up .3s both}
.bub.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}
.bub.me{background:var(--p);color:var(--surface);align-self:flex-end;border-end-end-radius:4px}
.cbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;background:var(--bg);padding:6px 0}
.cbar input{margin:0;flex:1}.cbar .btn{padding:0 14px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(108,63,209,.45);text-decoration:none;z-index:6}
.fab .ic{width:26px;height:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{font:inherit;font-size:14px;font-weight:600;background:var(--surface);color:var(--p);border:1.5px solid var(--p);border-radius:999px;padding:3px 14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 012-2h13v15H6a2 2 0 00-2 2zm0 0A2 2 0 006 21h13"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a3 3 0 003 3M16 6h4v1a3 3 0 01-3 3M12 13v4M8 21h8M10 17h4"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></symbol>
</svg>
<div class="hero"><div class="blob b1"></div><div class="blob b2"></div>
<div class="logo"><svg class="ic"><use href="#i-cap"/></svg></div>
<div><h1>موقع مدرستنا</h1><p>مكانك لكل اللي محتاجاه في المدرسة</p></div></div>
<nav id="nav"></nav>
<main id="app"></main>
<a class="fab" id="fab" href="#chat" aria-label="المساعد الذكي"><svg class="ic"><use href="#i-chat"/></svg></a>
<script>
var KARIMA="201020956352";                          // رقم مس كريمة بصيغة دولية بدون +
var API="https://sheetdb.io/api/v1/l5bu05bnss7oe";  // رابط SheetDB
var CHAT_API="https://rapid-wildflower-d6e4.msrybsmlh.workers.dev";                                    // رابط الـ Worker بتاع Gemini (شوفي الملف gemini-worker.js)
var pages=[["home","الرئيسية","home"],["chat","المساعد","chat"],["books","بنك الكتب","book"],["lost-found","المفقودات","search"],["study-share","الملخصات","file"],["leaderboard","لوحة الشرف","trophy"],["suggestions","المقترحات","mail"]];
var FAQ={
"عن المدرسة":[["مين مديرة المدرسة؟","مديرة المدرسة هي مس مروة أمين."],["مين وكيلة المدرسة؟","وكيلة المدرسة هي مس أسماء يحيي."],["المدرسة فين؟","مدرسة دكتور أحمد زويل في الحي 15 بمدينة العاشر من رمضان."],["فين معمل الكمبيوتر والمكتبة؟","معمل الكمبيوتر والمكتبة في الطابق الثاني."],["مين مس كريمة؟","مس كريمة هي اللي بتنسّق استلام وتسليم الكتب الخارجية والمفقودات على واتساب، وبسرية تامة."],["مواعيد الامتحانات إمتى؟","معنديش جدول الامتحانات. راجعي لوحة إعلانات المدرسة أو اسألي المعلمة."]],
"المذاكرة":[["إزاي أنظم وقتي؟","قسّمي يومك لفترات: ٤٥ دقيقة مذاكرة و١٠ دقايق راحة. ابدأي بالمادة الأصعب وإنتي نشيطة، واكتبي جدول أسبوعي بسيط فيه وقت للراحة والنوم."],["إزاي أذاكر للامتحان؟","راجعي الملخصات بدل ما تقري المنهج كله من الأول، وحلّي أسئلة وامتحانات السنين اللي فاتت. وقبل الامتحان نامي كويس."],["إزاي أركز وأنا بذاكر؟","ذاكري في مكان هادي وسيبي الموبايل بعيد. اشتغلي ٢٥ دقيقة وريّحي ٥ دقايق، واشربي مياه."],["محتاجة ملخصات","روحي لصفحة «الملخصات» في الموقع، هتلاقي ملخصات زميلاتك، وتقدري تنشري ملخصك كمان."]],
"عن الموقع":[["إزاي أطلب كتاب خارجي؟","روحي لصفحة «بنك الكتب» واضغطي «طلب الكتاب» جنب الكتاب. هيفتح واتساب مع مس كريمة بسرية تامة وبدون أي إحراج."],["إزاي أتبرع بكتاب؟","في صفحة «بنك الكتب» املي بيانات الكتاب واضغطي «أتبرع بالكتاب». ولو كتبتي اسمك الأول هتظهري في لوحة الشرف."],["ضاع مني حاجة أعمل إيه؟","روحي لصفحة «المفقودات» وسجّلي وصف الشيء. ومس كريمة هتساعدك في استلامه."],["إزاي أبعت اقتراح بدون اسم؟","من صفحة «المقترحات» اكتبي رسالتك واضغطي إرسال. اسمك مش بيتسجل خالص."]]
};
var chatHist=[];

function ic(n){return '<svg class="ic"><use href="#i-'+n+'"/></svg>'}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function wa(t){return "https://wa.me/"+KARIMA+"?text="+encodeURIComponent(t)}
function get(s){return fetch(API+"?sheet="+s).then(function(r){if(!r.ok)throw 0;return r.json()})}
function post(s,row){return fetch(API+"?sheet="+s,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:[row]})}).then(function(r){if(!r.ok)throw 0})}
function today(){return new Date().toISOString().slice(0,10)}
function app(h){document.getElementById("app").innerHTML=h}
function $(i){return document.getElementById(i)}
function empty(i,t){return '<div class="empty">'+ic(i)+'<p>'+t+'</p></div>'}
var err='<p class="note">مش قادرة أوصل لجدول البيانات دلوقتي. اتأكدي إن الموقع مرفوع على استضافة وإن الإنترنت شغال.</p>';

var V={
home:function(){var d={chat:"اسألي أي سؤال عن المدرسة والمذاكرة","books":"شوفي الكتب المتاحة وتبرعي بكتبك","lost-found":"ضاع منكِ حاجة أو لقيتي حاجة","study-share":"ملخصات وكشاكيل زميلاتك","leaderboard":"سفيرات الخير","suggestions":"رأيك بدون اسم"};
 app('<h2>تحبي تروحي فين؟</h2><div class="grid">'+pages.slice(1).map(function(p,i){return '<a class="tile'+(p[0]==="chat"?' wide':'')+'" style="animation-delay:'+i*.06+'s" href="#'+p[0]+'"><div class="bx">'+ic(p[2])+'</div><b>'+(p[0]==="chat"?"المساعد الذكي":p[1])+'</b><span>'+d[p[0]]+'</span></a>'}).join("")+'</div>')},

chat:function(){
 app('<h2>المساعد الذكي</h2><p class="sub">اختاري موضوع وسؤال وأنا أجاوبك.</p><div class="chat" id="ch"></div><div class="chips" id="cc"></div><div class="cbar"><input id="ci" placeholder="أو اكتبي سؤالك هنا" autocomplete="off"><button class="btn" id="cs" aria-label="إرسال">'+ic("send")+'</button></div>');
 function add(t,w){var b=document.createElement("div");b.className="bub "+w;b.textContent=t;$("ch").appendChild(b);return b}
 function chip(t,f){var c=document.createElement("button");c.className="chip";c.textContent=t;c.onclick=f;$("cc").appendChild(c)}
 function end(){$("cc").scrollIntoView({block:"end"})}
 function menu(){$("cc").innerHTML="";Object.keys(FAQ).forEach(function(k){chip(k,function(){add(k,"me");add("تمام، اختاري السؤال اللي عايزاه:","bot");qs(k)})});end()}
 function qs(k){$("cc").innerHTML="";FAQ[k].forEach(function(x){chip(x[0],function(){add(x[0],"me");add(x[1],"bot");qs(k)})});chip("رجوع للمواضيع",function(){menu()});end()}
 add("مرحباً بكِ يا صديقتي، أنا شات بوت مساعد ذكي، تم تصميمي من مدرسة دكتور أحمد زويل. اختاري موضوع من تحت وأنا أجاوبك.","bot");menu();
 function send(){var i=$("ci"),t=i.value.trim();if(!t)return;i.value="";add(t,"me");
  if(!CHAT_API){add("اختاري سؤال من الأزرار اللي تحت.","bot");end();return}
  var w=add("...","bot");end();
  fetch(CHAT_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,history:chatHist.slice(-10)})}).then(function(r){return r.json()}).then(function(d){var r=d.reply||"معلش، حصلت مشكلة. جرّبي تاني.";w.textContent=r;chatHist.push({role:"user",text:t},{role:"model",text:r});end()}).catch(function(){w.textContent="معلش، مقدرتش أرد دلوقتي. اختاري سؤال من الأزرار.";end()})}
 $("cs").onclick=send;$("ci").onkeydown=function(e){if(e.key==="Enter")send()}},

books:function(){
 app('<h2>بنك الكتب الخارجية</h2><p class="sub">اختاري الكتاب، ومس كريمة هتنسّق الاستلام بسرية تامة.</p><div id="bl"><p class="m">جاري التحميل...</p></div><div class="card col"><div class="t">عندك كتاب من السنة اللي فاتت؟</div><label for="bt">اسم الكتاب</label><input id="bt" placeholder="مثال: كتاب الامتحان - عربي"><label for="bg">الصف</label><select id="bg"><option>سنة أولى</option><option>سنة ثانية</option><option>سنة ثالثة</option></select><label for="bd">اسمك الأول (اختياري، علشان تظهري في لوحة الشرف)</label><input id="bd"><button class="btn" id="badd">أتبرع بالكتاب</button><p class="msg" id="bm"></p></div>');
 get("books").then(function(rows){var g={};rows.forEach(function(r){if(!r.title||r.status==="taken")return;var k=r.title+"|"+(r.grade||"");g[k]=g[k]||{t:r.title,gr:r.grade,n:0};g[k].n++});
  var ks=Object.keys(g);$("bl").innerHTML=ks.length?ks.map(function(k){var b=g[k];return '<div class="card"><div><div class="t">'+esc(b.t)+'</div><div class="m">'+esc(b.gr)+' · <span class="cnt">متاح '+b.n+'</span></div></div><a class="btn" target="_blank" rel="noopener" href="'+wa("أريد طلب كتاب: "+b.t)+'">طلب الكتاب</a></div>'}).join(""):empty("book","لسه مفيش كتب. كوني أول من يتبرع.")}).catch(function(){$("bl").innerHTML=err});
 $("badd").onclick=function(){var t=$("bt").value.trim(),m=$("bm");if(!t){m.textContent="اكتبي اسم الكتاب الأول.";return}var gr=$("bg").value;
  window.open(wa("السلام عليكم يا مس كريمة، أنا حابة أتبرع بكتاب: "+t+" ("+gr+")"),"_blank");
  post("books",{title:t,grade:gr,status:"available",added:today(),donor:$("bd").value.trim()}).then(function(){m.textContent="شكراً يا سفيرة الخير! كمّلي مع مس كريمة على واتساب.";setTimeout(V.books,1500)}).catch(function(){m.textContent="فتحنالك واتساب مع مس كريمة. كمّلي معاها هناك."})}},

"lost-found":function(){
 app('<h2>سوق المفقودات</h2><p class="sub">سجّلي مواصفات الشيء، ومس كريمة هتساعدك في استلامه.</p><div class="card col"><label for="lk">النوع</label><select id="lk"><option>ضاع مني</option><option>لقيته</option></select><label for="lt">الوصف</label><input id="lt" placeholder="مثال: مقلمة زرقاء"><button class="btn" id="ladd">إضافة</button></div><div id="ll"><p class="m">جاري التحميل...</p></div>');
 get("lost").then(function(r){r=r.filter(function(x){return x.desc}).reverse();$("ll").innerHTML=r.length?r.map(function(x){return '<div class="card"><div><span class="badge">'+esc(x.type)+'</span><div class="t">'+esc(x.desc)+'</div></div><a class="btn alt" target="_blank" rel="noopener" href="'+wa("بخصوص المفقودات: "+x.desc)+'">مس كريمة</a></div>'}).join(""):empty("search","مفيش مفقودات دلوقتي.")}).catch(function(){$("ll").innerHTML=err});
 $("ladd").onclick=function(){var v=$("lt").value.trim();if(!v)return;var k=$("lk").value;window.open(wa("السلام عليكم يا مس كريمة، بخصوص المفقودات ("+k+"): "+v),"_blank");post("lost",{type:k,desc:v,date:today()}).then(V["lost-found"]).catch(function(){})}},

"study-share":function(){
 app('<h2>بنك الملخصات والملزمات</h2><p class="sub">ارفعي الملخص على جوجل درايف وانشري رابطه هنا.</p><div class="card col"><label for="ut">عنوان الملخص</label><input id="ut"><label for="us">المادة</label><select id="us"><option>عربي</option><option>إنجليزي</option><option>رياضيات</option><option>علوم</option><option>دراسات</option><option>أخرى</option></select><label for="ul">رابط الملف (يبدأ بـ https)</label><input id="ul" type="url" dir="ltr"><button class="btn" id="uadd">نشر الملخص</button><p class="msg" id="um"></p></div><div id="ml"><p class="m">جاري التحميل...</p></div>');
 get("summaries").then(function(r){r=r.filter(function(x){return x.title&&/^https:\/\//.test(x.link||"")}).reverse();$("ml").innerHTML=r.length?r.map(function(x){return '<div class="card"><div><div class="t">'+esc(x.title)+'</div><div class="m">'+esc(x.subject)+'</div></div><a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(x.link)+'">فتح</a></div>'}).join(""):empty("file","لسه مفيش ملخصات. انشري أول ملخص.")}).catch(function(){$("ml").innerHTML=err});
 $("uadd").onclick=function(){var t=$("ut").value.trim(),l=$("ul").value.trim(),m=$("um");if(!t||!/^https:\/\//.test(l)){m.textContent="اكتبي العنوان ورابط صحيح يبدأ بـ https.";return}
  post("summaries",{title:t,subject:$("us").value,link:l,date:today()}).then(function(){V["study-share"]()}).catch(function(){m.textContent="حصلت مشكلة، جرّبي تاني."})}},

leaderboard:function(){
 app('<h2>لوحة الشرف الرقمية</h2><p class="sub">سفيرات الخير حسب عدد الكتب المتبرع بها (١٠ نقاط لكل كتاب).</p><div id="lb"><p class="m">جاري التحميل...</p></div>');
 get("books").then(function(rows){var c={};rows.forEach(function(r){var n=(r.donor||"").trim();if(n)c[n]=(c[n]||0)+1});
  var a=Object.keys(c).sort(function(x,y){return c[y]-c[x]}).slice(0,10);
  $("lb").innerHTML=a.length?a.map(function(n,i){return '<div class="card"><div class="rk"><div class="rank">'+(i+1)+'</div><div><div class="t">'+esc(n)+'</div><div class="m">'+c[n]*10+' نقطة تميز</div></div></div>'+(i===0?'<span class="badge">سفيرة الخير</span>':'')+'</div>'}).join(""):empty("trophy","لسه مفيش ترتيب. تبرعي بكتاب واكتبي اسمك، وهتظهري هنا.")}).catch(function(){$("lb").innerHTML=err})},

suggestions:function(){app('<h2>صندوق المقترحات السري</h2><p class="sub">اسمك مش بيتسجل خالص.</p><div class="card col"><label for="st">رسالتك</label><textarea id="st" rows="5"></textarea><button class="btn" id="ss">إرسال</button><p class="msg" id="sm"></p></div>');
 $("ss").onclick=function(){var t=$("st").value.trim();if(!t)return;post("suggestions",{text:t,date:today()}).then(function(){$("st").value="";$("sm").textContent="وصلت رسالتك، شكراً يا صديقتي."}).catch(function(){$("sm").textContent="حصلت مشكلة، جرّبي تاني."})}}
};

function route(){var r=(location.hash||"#home").slice(1);if(!V[r])r="home";
 $("nav").innerHTML=pages.map(function(p){return '<a href="#'+p[0]+'"'+(p[0]===r?' class="on" aria-current="page"':'')+'>'+ic(p[2])+p[1]+'</a>'}).join("");
 $("fab").style.display=r==="chat"?"none":"grid";window.scrollTo(0,0);V[r]()}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
