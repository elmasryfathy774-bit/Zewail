<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المدرسة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f4fb;--c:#fff;--t:#1f1b2e;--m:#6b6680;--p:#6c3fd1;--b:#e6e1f2;--r:#b42318;--rb:#fde8e8;--g:#0f8f77}
@media(prefers-color-scheme:dark){:root{--bg:#15121f;--c:#201b30;--t:#f1eefb;--m:#a49fba;--b:#332c4a;--rb:#4a1f24;--r:#ff9a92}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Cairo,sans-serif;padding:12px}
h2{margin:6px 0 12px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0}
input,select,textarea,button{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t)}
button{background:var(--p);color:#fff;border:0;cursor:pointer;font-weight:600}button.alt{background:var(--c);color:var(--p);border:1px solid var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.tabs button{background:var(--c);color:var(--t);border:1px solid var(--b);white-space:nowrap}.tabs button.on{background:var(--p);color:#fff}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:7px;border-bottom:1px solid var(--b);text-align:right}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}
.k b{font-size:22px;display:block;color:var(--p)}.warn{background:var(--rb);color:var(--r);padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.bar{height:8px;background:var(--b);border-radius:9px;min-width:80px}.bar i{display:block;height:100%;background:var(--r);border-radius:9px}
.m{color:var(--m)}#ld{position:fixed;inset:0;background:#0006;display:none;place-items:center;color:#fff;font-weight:800;z-index:9}
#login{max-width:340px;margin:18vh auto}.ab{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b)}.ab label{flex:1}
</style>
</head>
<body>
<div id="ld">جاري التحميل...</div>
<div id="login" class="card"><h2>دخول الإدارة</h2><input id="pw" type="password" placeholder="كلمة المرور" style="width:100%"><button id="go" style="width:100%;margin-top:8px">دخول</button><p class="m" id="lm"></p></div>
<div id="main" hidden>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</div>
<script>
var API="https://sheetdb.io/api/v1/4f6j4m9d8po12";
var PASS_HASH="fe2e67ef8c907f13755006e274dc9e091ed8a6ebcf74e846f440310f04035939"; // SHA-256 لكلمة المرور (الافتراضية: zewail2026)
var MAXABS=15;
var D={st:[],at:[],gr:[]},IX={};
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function ld(on){$("ld").style.display=on?"grid":"none"}
function ymd(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function add(d,n){var x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return ymd(x)}
function yearStart(){var n=new Date(),y=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;return y+"-09-01"}
function api(m,p,b){return fetch(API+p,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){if(!r.ok&&m!=="DELETE")throw 0;return r})}
function getS(s){return api("GET","?sheet="+s).then(function(r){return r.json()})}
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}

// تحميل البيانات مرة واحدة بالتوازي وبعدها ندخل الواجهة (بدون تعليق)
function load(){ld(1);return Promise.all([getS("students"),getS("attendance"),getS("grades")]).then(function(R){
 D.st=R[0].filter(function(s){return s.code});D.at=R[1];D.gr=R[2];index();ld(0)}).catch(function(){ld(0);alert("مش قادر أوصل لجدول البيانات. اتأكد إن التابات students / attendance / grades موجودة في الشيت.")})}
function index(){IX={days:{},abs:{},sc:{}};
 D.at.forEach(function(r){if(!r.date)return;IX.days[r.date]=1;if(r.status==="absent"){(IX.abs[r.code]=IX.abs[r.code]||[]).push(r.date)}});
 D.gr.forEach(function(r){var m=+r.max;if(m>0&&r.score!==""&&r.score!=null)(IX.sc[r.code]=IX.sc[r.code]||[]).push([r.date||"",+r.score/m*100])})}
function avg(code,f,t){var a=(IX.sc[code]||[]).filter(function(x){return!f||(x[0]>=f&&x[0]<=t)});if(!a.length)return null;return a.reduce(function(s,x){return s+x[1]},0)/a.length}
function cnt(code,f,t){return(IX.abs[code]||[]).filter(function(d){return d>=f&&d<=t}).length}
function daysIn(f,t){return Object.keys(IX.days).filter(function(d){return d>=f&&d<=t}).length}

var TABS=[["stats","الإحصائيات"],["att","تسجيل الحضور"],["grd","الدرجات"],["stu","الطلبة"]];
function tab(k){$("tabs").innerHTML=TABS.map(function(t){return'<button class="'+(t[0]===k?"on":"")+'" onclick="tab(\''+t[0]+'\')">'+t[1]+"</button>"}).join("");V[k]()}

var R0=null;
var V={
stats:function(){var t=ymd(new Date()),n=new Date(),dow=(n.getDay()+1)%7,ws=add(t,-dow);
 $("v").innerHTML='<h2>إحصائيات الحضور والدرجات</h2><div class="card row"><select id="pr"><option value="w">هذا الأسبوع</option><option value="w2">آخر أسبوعين</option><option value="m">هذا الشهر</option><option value="c">فترة محددة</option></select><input type="date" id="f"><input type="date" id="t"><button id="sh">عرض</button><button class="alt" id="dl">تنزيل التقرير</button></div><div id="o"></div>';
 $("f").value=ws;$("t").value=t;
 $("pr").onchange=function(){var v=this.value;if(v==="w"){$("f").value=ws}else if(v==="w2"){$("f").value=add(ws,-7)}else if(v==="m"){$("f").value=t.slice(0,8)+"01"}$("t").value=t};
 $("sh").onclick=function(){V.run()};$("dl").onclick=function(){V.csv()};V.run()},
run:function(){var f=$("f").value,t=$("t").value,ys=yearStart(),nd=daysIn(f,t),N=D.st.length,tot=0,who=0,rows=[],warns=0;
 D.st.forEach(function(s){var a=cnt(s.code,f,t),y=cnt(s.code,ys,"9999"),av=avg(s.code,f,t);tot+=a;if(a)who++;if(y>MAXABS)warns++;rows.push({s:s,a:a,y:y,av:av})});
 rows.sort(function(x,y){return y.a-x.a||y.y-x.y});R0={f:f,t:t,rows:rows,nd:nd,N:N,tot:tot,who:who,warns:warns};
 var rate=nd&&N?tot/(nd*N)*100:0,wk="";
 for(var s=f,i=1;s<=t;s=add(s,7),i++){var e=add(s,6);if(e>t)e=t;var d=daysIn(s,e),a=0;D.st.forEach(function(x){a+=cnt(x.code,s,e)});var r=d&&N?a/(d*N)*100:0;
  wk+='<tr><td>أسبوع '+i+'</td><td>'+s+' ← '+e+'</td><td>'+d+'</td><td>'+a+'</td><td>'+r.toFixed(1)+'%</td><td><div class="bar"><i style="width:'+Math.min(100,r)+'%"></i></div></td></tr>'}
 R0.rate=rate;R0.wk=wk;
 $("o").innerHTML='<div class="k"><div>عدد الطالبات<b>'+N+'</b></div><div>غائبات في الفترة<b>'+who+'</b></div><div>نسبة الغياب<b>'+rate.toFixed(1)+'%</b></div><div>أيام مسجلة<b>'+nd+'</b></div><div>إنذارات (+'+MAXABS+' يوم)<b>'+warns+'</b></div></div>'
 +'<div class="card sc"><b>النسبة لكل أسبوع</b><table><tr><th></th><th>الفترة</th><th>أيام</th><th>غياب</th><th>النسبة</th><th></th></tr>'+wk+'</table></div>'
 +'<div class="card sc"><table><tr><th>الاسم</th><th>الفصل</th><th>غياب الفترة</th><th>غياب السنة</th><th>المعدل</th><th>الحالة</th></tr>'
 +rows.map(function(x){return'<tr><td>'+esc(x.s.name)+'</td><td>'+esc(x.s["class"]||"")+'</td><td>'+x.a+'</td><td>'+x.y+'</td><td>'+(x.av==null?"—":Math.round(x.av)+"%")+'</td><td>'+(x.y>MAXABS?'<span class="warn">إنذار</span>':"")+"</td></tr>"}).join("")+"</table></div>"},
csv:function(){if(!R0)return;var q=function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'},L=[];
 L.push(["تقرير الحضور والغياب",R0.f,R0.t].map(q).join(","));
 L.push(["عدد الطالبات",R0.N].map(q).join(","));L.push(["عدد الغائبات في الفترة",R0.who].map(q).join(","));
 L.push(["نسبة الغياب بالمدرسة",R0.rate.toFixed(1)+"%"].map(q).join(","));L.push(["عدد الإنذارات",R0.warns].map(q).join(","));L.push("");
 L.push(["الكود","الاسم","الفصل","غياب الفترة","غياب السنة","المعدل","الحالة"].map(q).join(","));
 R0.rows.forEach(function(x){L.push([x.s.code,x.s.name,x.s["class"],x.a,x.y,x.av==null?"":Math.round(x.av)+"%",x.y>MAXABS?"إنذار":""].map(q).join(","))});
 var b=new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="report_"+R0.f+"_"+R0.t+".csv";a.click()},

att:function(){var t=ymd(new Date());
 $("v").innerHTML='<h2>تسجيل الحضور</h2><div class="card row"><input type="date" id="ad" value="'+t+'"><select id="ac"></select><button id="ar">تحديد الكل حاضرة</button><button id="as">حفظ</button></div><div class="card" id="al"></div>';
 var cl=Object.keys(D.st.reduce(function(o,s){o[s["class"]||""]=1;return o},{}));$("ac").innerHTML='<option value="">كل الفصول</option>'+cl.map(function(c){return"<option>"+esc(c)+"</option>"}).join("");
 function draw(){var d=$("ad").value,c=$("ac").value,ab=(D.at.filter(function(r){return r.date===d&&r.status==="absent"})).map(function(r){return r.code});
  $("al").innerHTML=D.st.filter(function(s){return!c||s["class"]===c}).map(function(s){return'<div class="ab"><label for="x'+esc(s.code)+'">'+esc(s.name)+'</label><input type="checkbox" id="x'+esc(s.code)+'" data-c="'+esc(s.code)+'"'+(ab.indexOf(s.code)>-1?" checked":"")+'> غائبة</div>'}).join("")||'<p class="m">لا يوجد طلبة. أضيفيهم من تبويب الطلبة.</p>'}
 $("ad").onchange=$("ac").onchange=draw;$("ar").onclick=function(){document.querySelectorAll("#al input").forEach(function(i){i.checked=false})};draw();
 $("as").onclick=function(){var d=$("ad").value,c=$("ac").value;if(!d)return;
  var inScope={};D.st.forEach(function(s){if(!c||s["class"]===c)inScope[s.code]=1});
  var marks={};document.querySelectorAll("#al input").forEach(function(i){marks[i.dataset.c]=i.checked});
  var keep=D.at.filter(function(r){return r.date===d&&r.code!=="_DAY"&&!inScope[r.code]&&r.status==="absent"});
  var rows=[{date:d,code:"_DAY",status:"day"}];keep.forEach(function(r){rows.push({date:d,code:r.code,status:"absent"})});
  Object.keys(marks).forEach(function(k){if(marks[k])rows.push({date:d,code:k,status:"absent"})});
  ld(1);api("DELETE","/date/"+encodeURIComponent(d)+"?sheet=attendance").then(function(){return api("POST","?sheet=attendance",{data:rows})}).then(function(){D.at=D.at.filter(function(r){return r.date!==d}).concat(rows);index();ld(0);alert("تم الحفظ")}).catch(function(){ld(0);alert("حصلت مشكلة في الحفظ، جرّب تاني.")})}},

grd:function(){var t=ymd(new Date());
 $("v").innerHTML='<h2>الدرجات</h2><div class="card row"><input id="gs" placeholder="المادة"><input id="gm" type="number" placeholder="الدرجة النهائية" value="20" style="width:130px"><input id="gd" type="date" value="'+t+'"><button id="gv">حفظ</button></div><div class="card" id="gl">'+D.st.map(function(s){return'<div class="ab"><label>'+esc(s.name)+'</label><input type="number" step="0.5" data-c="'+esc(s.code)+'" style="width:90px"></div>'}).join("")+"</div>";
 $("gv").onclick=function(){var s=$("gs").value.trim(),m=$("gm").value,d=$("gd").value,rows=[];if(!s||!m){alert("اكتب المادة والدرجة النهائية");return}
  document.querySelectorAll("#gl input").forEach(function(i){if(i.value!=="")rows.push({code:i.dataset.c,subject:s,score:i.value,max:m,date:d})});if(!rows.length)return;
  ld(1);api("POST","?sheet=grades",{data:rows}).then(function(){D.gr=D.gr.concat(rows);index();ld(0);alert("تم حفظ "+rows.length+" درجة");document.querySelectorAll("#gl input").forEach(function(i){i.value=""})}).catch(function(){ld(0);alert("حصلت مشكلة في الحفظ.")})}},

stu:function(){$("v").innerHTML='<h2>الطلبة ('+D.st.length+')</h2><div class="card"><p class="m">الصقي الطالبات، كل واحدة في سطر: <b>الكود,الاسم,الفصل,تليفون ولي الأمر</b></p><textarea id="im" rows="7" style="width:100%" dir="ltr" placeholder="1001,Mona Ali,2/5,01012345678"></textarea><button id="ib">استيراد</button></div>';
 $("ib").onclick=function(){var rows=$("im").value.split("\n").map(function(l){return l.split(/[,\t]/).map(function(x){return x.trim()})}).filter(function(a){return a[0]&&a[1]&&a[0]!=="code"&&a[0]!=="الكود"}).map(function(a){return{code:a[0],name:a[1],"class":a[2]||"",phone:a[3]||""}});
  var have={};D.st.forEach(function(s){have[s.code]=1});rows=rows.filter(function(r){return!have[r.code]});if(!rows.length){alert("مفيش طلبة جديدة");return}
  ld(1);api("POST","?sheet=students",{data:rows}).then(function(){D.st=D.st.concat(rows);ld(0);V.stu()}).catch(function(){ld(0);alert("حصلت مشكلة في الاستيراد.")})}}
};

function enter(){$("login").hidden=true;$("main").hidden=false;load().then(function(){tab("stats")})}
$("go").onclick=function(){sha($("pw").value).then(function(h){if(h===PASS_HASH){try{sessionStorage.setItem("adm","1")}catch(e){}enter()}else $("lm").textContent="كلمة المرور غير صحيحة"})};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").onclick()};
try{if(sessionStorage.getItem("adm")==="1")enter()}catch(e){}
</script>
</body>
</html>
