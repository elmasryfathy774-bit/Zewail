<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta charset="utf-8">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Cairo,sans-serif;padding:12px}
h2{margin:6px 0 12px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0}
input,select,textarea,button{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t)}
button{background:var(--p);color:#fff;border:0;cursor:pointer;font-weight:600}button.alt{background:var(--c);color:var(--p);border:1px solid var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.tabs button{background:var(--c);color:var(--t);border:1px solid var(--b);white-space:nowrap}.tabs button.on{background:var(--p);color:#fff}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:7px;border-bottom:1px solid var(--b);text-align:right}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}
.k b{font-size:22px;display:block;color:var(--p)}.warn{background:var(--rb);color:var(--r);padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.bar{height:8px;background:var(--b);border-radius:9px;min-width:80px}.bar i{display:block;height:100%;background:var(--r);border-radius:9px}
.m{color:var(--m)}#ld{position:fixed;inset:0;background:#0006;display:none;place-items:center;color:#fff;font-weight:800;z-index:9}
#login{max-width:340px;margin:18vh auto}.ab{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b)}.ab label{flex:1}
.err{color:var(--r)}#sync{font-size:13px;margin:4px 0}input[type=file]{width:100%;margin:6px 0}
</style>
</head>

 var b=new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="report_"+R0.f+"_"+R0.t+".csv";a.click()},

 var cl=Object.keys(D.st.reduce(function(o,s){o[s["class"]||""]=1;return o},{}));$("ac").innerHTML='<option value="">كل الفصول</option>'+cl.map(function(c){return"<option>"+esc(c)+"</option>"}).join("");
 function draw(){var d=$("ad").value,c=$("ac").value,ab=(D.at.filter(function(r){return r.date===d&&r.status==="absent"})).map(function(r){return r.code});
  $("al").innerHTML=D.st.filter(function(s){return!c||s["class"]===c}).map(function(s){return'<div class="ab"><label for="x'+esc(s.code)+'">'+esc(s.name)+'</label><input type="checkbox" id="x'+esc(s.code)+'" data-c="'+esc(s.code)+'"'+(ab.indexOf(s.code)>-1?" checked":"")+'> غائبة</div>'}).join("")||'<p class="m">لا يوجد طلبة. أضيفيهم من تبويب الطلبة.</p>'}
 $("ad").onchange=$("ac").onchange=draw;$("ar").onclick=function(){document.querySelectorAll("#al input").forEach(function(i){i.checked=false})};draw();
